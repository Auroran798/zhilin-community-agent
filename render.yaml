services:
  - type: web
    name: zhilin-agent-demo
    runtime: python
    plan: free
    buildCommand: pip install -e .
    preDeployCommand: alembic upgrade head && python -m data.seed && python scripts/import_knowledge.py --reindex-all
    startCommand: sh -c 'uvicorn api.main:app --host 127.0.0.1 --port 8000 & exec streamlit run web/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: APP_ENV
        value: development
      - key: DATA_MODE
        value: demo
      - key: PRODUCT_MODE
        value: domestic_beijing
      - key: RAG_EMBEDDING_PROVIDER
        value: hash
      - key: RAG_RERANKER_PROVIDER
        value: lexical
      - key: RAG_LLM_PROVIDER
        value: disabled
      - key: AGENT_LLM_PROVIDER
        value: fake
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: DemoPass123!
