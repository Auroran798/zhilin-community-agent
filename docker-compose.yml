name: zhilin-community-agent

services:
  api:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mcr.microsoft.com/azurelinux/base/python:3.12}
    command: sh -c "alembic upgrade head && python3 -m data.seed && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mcr.microsoft.com/azurelinux/base/python:3.12}
    command: streamlit run web/app.py --server.address 0.0.0.0 --server.port 8501
    environment: [API_BASE_URL=http://api:8000]
    ports: ["${WEB_PORT:-8501}:8501"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mcr.microsoft.com/azurelinux/base/python:3.12}
    command: python3 -m scripts.run_outbox_worker
    volumes: ["./data:/app/data"]
    depends_on:
      api:
        condition: service_healthy
