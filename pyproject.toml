[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "zhilin-community-agent"
version = "1.3.0"
description = "智邻管家物业社区管理智能体"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "starlette>=1.4.1,<1.5",
  "sse-starlette>=1.6.1,<3",
  "uvicorn[standard]>=0.30,<0.36",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.19,<1.20",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.3,<3",
  "PyJWT>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "streamlit>=1.37,<2",
  "httpx>=0.27,<0.29"
  ,"psycopg[binary]>=3.2,<4"
  # 1.0.0-1.5.9 are affected by critical CVE-2026-45829 with no patched
  # release as of 2026-08-09. Embedded 0.6.3 remains API-compatible here.
  ,"chromadb>=0.6.3,<0.7"
  ,"pypdf>=6.13.3,<7"
  ,"python-docx>=1.1,<2"
  ,"beautifulsoup4>=4.12,<5"
  ,"python-multipart>=0.0.31,<1"
  ,"langgraph>=1.2,<1.3"
  ,"langgraph-checkpoint-sqlite>=3.1,<4"
  ,"mcp>=1.29,<2"
  ,"msgpack>=1.2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "playwright>=1.50,<2", "ruff>=0.8,<1", "bandit>=1.7,<2", "pip-audit>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["api*", "domain*", "data*", "data_pipeline*", "web*", "rag*", "agent*", "skills*", "harness*", "mcp_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["api", "domain", "data"]
